<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="45" fill="#0A0A0F" stroke="#FF3366" stroke-width="2"/>
  
  <!-- Stylized D -->
  <path d="M30,30 L45,30 C55,30 60,40 60,50 C60,60 55,70 45,70 L30,70 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- The Broadcast "Record" Dot (Livestream indicator) -->
  <circle cx="32" cy="50" r="4" fill="#FF3366">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Subtle "IN THE GAME" wrap -->
  <path d="M50,85 L80,85" stroke="#FF3366" stroke-width="2" stroke-dasharray="2 4" fill="none"/>
</svg>
