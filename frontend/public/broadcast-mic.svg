<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#FF9933"/>
    </linearGradient>
  </defs>
  
  <!-- Broadcast Signal Waves -->
  <path d="M30,35 Q20,50 30,65" fill="none" stroke="url(#grad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M22,25 Q8,50 22,75" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Central Microphone body (The "I" in IN) -->
  <rect x="45" y="30" width="10" height="35" rx="5" fill="#FFFFFF"/>
  <!-- Mic Grill lines -->
  <line x1="45" y1="40" x2="55" y2="40" stroke="#1E1E2E" stroke-width="1.5"/>
  <line x1="45" y1="45" x2="55" y2="45" stroke="#1E1E2E" stroke-width="1.5"/>
  <line x1="45" y1="50" x2="55" y2="50" stroke="#1E1E2E" stroke-width="1.5"/>
  <line x1="45" y1="55" x2="55" y2="55" stroke="#1E1E2E" stroke-width="1.5"/>
  
  <!-- Mic Base -->
  <path d="M40,65 L60,65 L58,72 L42,72 Z" fill="#FFFFFF"/>
</svg>
