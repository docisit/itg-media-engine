<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - DOC Media</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .header .logo { font-size: 28px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px; }
        .header h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .content { padding: 40px 30px; text-align: center; }
        .check-icon {
            width: 80px; height: 80px;
            background: #d1fae5;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            animation: popIn 0.4s ease-out;
        }
        .check-icon svg { width: 40px; height: 40px; fill: none; stroke: #059669; stroke-width: 3; }
        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .content h2 { font-size: 22px; color: #059669; margin-bottom: 12px; }
        .content p { font-size: 14px; color: #64748b; line-height: 1.7; max-width: 360px; margin: 0 auto; }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 24px;
        }
        .btn:hover { opacity: 0.95; }
        .footer {
            text-align: center;
            padding: 20px 30px;
            border-top: 1px solid #f3f4f6;
            font-size: 12px;
            color: #9ca3af;
        }
        .footer a { color: #667eea; text-decoration: none; }
        .confetti {
            position: fixed;
            top: -10px;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            animation: fall linear forwards;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">DOC Media</div>
            <h1>Password Changed</h1>
            <p>Your password has been successfully reset</p>
        </div>
        
        <div class="content">
            <div class="check-icon">
                <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            
            <h2>All Set!</h2>
            <p>Your password has been changed successfully. You can now log in with your new password.</p>
            
            <a href="https://yourdomain.com/login" class="btn">Sign In with New Password</a>
        </div>
        
        <div class="footer">
            <p>&copy; 2026 DOC Media. All rights reserved.</p>
            <p>Powered by <a href="https://yourdomain.com">yourdomain.com</a></p>
        </div>
    </div>

    <script>
        // Celebrate with mini confetti
        document.addEventListener('DOMContentLoaded', function() {
            const colors = ['#667eea', '#764ba2', '#10b981', '#f59e0b', '#ef4444', '#3b82f6'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 6 + 4) + 'px';
                confetti.style.height = (Math.random() * 6 + 4) + 'px';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 1.5 + 's';
                document.body.appendChild(confetti);
            }
        });
    </script>
</body>
</html>
