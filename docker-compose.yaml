services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /opt/livekit/livekit.yaml
    network_mode: host
    volumes:
      - /etc/livekit/livekit.yaml:/opt/livekit/livekit.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  egress:
    image: livekit/egress:latest
    # Remove the 'command' line entirely for this test
    cap_add:
      - SYS_ADMIN
    network_mode: host
    shm_size: '1gb'
    environment:
      - EGRESS_CONFIG_FILE=/opt/livekit/egress.yaml  # This tells Egress exactly where to look
    volumes:
      - /etc/livekit/egress.yaml:/opt/livekit/egress.yaml:ro


  ingress:
    image: livekit/ingress:latest
    command: --config /opt/livekit/ingress.yaml # Add this line
    network_mode: host
    volumes:
      - /etc/livekit/ingress.yaml:/opt/livekit/ingress.yaml:ro
