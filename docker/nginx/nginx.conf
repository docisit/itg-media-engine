# ===========================================================
# Unified Nginx Configuration — Dockerized
#   Replaces ALL 5 subdomain conf files with one clean config.
#   Routes by server_name to the correct internal container.
#
#   Subdomains managed:
#     yourdomain.com / www.yourdomain.com    → Next.js + Django
#     api.yourdomain.com                     → Django REST API
#     vdo.yourdomain.com                     → LiveKit + WHIP + Video
#     live.yourdomain.com                    → Redirect to yourdomain.com/broadcast
# ===========================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings (Let's Encrypt certs mounted as volumes)
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ##
    # Security Headers (applied globally)
    ##
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ##
    # Optimizations
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ##
    # Upstreams (Docker internal network — service names)
    ##
    upstream nextjs {
        server nextjs:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream django_api {
        server django:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream daphne_ws {
        server django:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream livekit_ws {
        server host.docker.internal:7880 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    ##
    # Global HTTP → HTTPS redirect
    ##
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================================
    # yourdomain.com — Main site (Next.js + Django APIs)
    # ===========================================================
    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;

        ssl_certificate /etc/ssl/mediasite/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/ssl/mediasite/live/yourdomain.com/privkey.pem;

        # ---- WebSocket signaling (Daphne) ----
        location ~ ^/ws {
            proxy_pass http://daphne_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ---- Django Admin ----
        location /admin-hq2024/ {
            proxy_pass http://django_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Next.js API routes (auth, guest-room, whip, room-status, connection-details, webrtc) ----
        location ~ ^/api/(auth|guest-room|whip|room-status|connection-details|webrtc) {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # ---- Django REST API (all other /api/ routes) ----
        location /api/ {
            proxy_pass http://django_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Static & Media assets ----
        # IMPORTANT: Proxy _next/static to Next.js container, NOT host volume mount.
        # Using alias with host volume causes hash mismatch between container build and host build.
        location /_next/static {
            proxy_pass http://nextjs;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        location /static/ {
            alias /var/www/static/backend/;
            expires 30d;
            access_log off;
        }

        # IMPORTANT: Next.js page routes under /media/ must come BEFORE the static alias.
        location /media/upload {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }

        # Route /media/watch/ to Next.js (dynamic route for media detail view)
        location /media/watch {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static media files (falls through to here if no Next.js route matched)
        location /media/ {
            alias /var/www/media/;
            expires 7d;
        }

        # ---- Next.js catch-all ----
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }

    # ===========================================================
    # api.yourdomain.com — Direct Django API access
    # ===========================================================
    server {
        listen 443 ssl http2;
        server_name api.yourdomain.com;

        ssl_certificate /etc/ssl/mediasite/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/ssl/mediasite/live/yourdomain.com/privkey.pem;

        # ---- WebSocket ----
        location /ws/ {
            proxy_pass http://daphne_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ---- API ----
        location /api/ {
            proxy_pass http://django_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Static & Media ----
        location /static/ {
            alias /var/www/static/backend/;
            expires 30d;
            access_log off;
        }

        location /media/ {
            alias /var/www/media/;
            expires 7d;
        }

        location / {
            return 404;
        }
    }

    # ===========================================================
    # vdo.yourdomain.com — LiveKit + WHIP Ingress + Video
    # ===========================================================
    server {
        listen 443 ssl http2;
        server_name vdo.yourdomain.com;

        ssl_certificate /etc/ssl/mediasite/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/ssl/mediasite/live/yourdomain.com/privkey.pem;

        access_log /var/log/nginx/vdo.yourdomain.com_access.log;
        error_log /var/log/nginx/vdo.yourdomain.com_error.log;

        # ---- WHIP Ingress (LiveKit Ingress on port 8080) ----
        location /w/ {
            proxy_pass http://host.docker.internal:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # ---- LiveKit WebRTC WebSocket ----
        location ~ ^/(rtc|twirp|ws)/ {
            proxy_pass http://livekit_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CRITICAL: Strip LiveKit's CORS headers, add our own
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
            proxy_hide_header 'Access-Control-Max-Age';

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://yourdomain.com' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_read_timeout 86400;
        }

        # ---- LiveKit catch-all (HTTP validate, etc.) ----
        location / {
            proxy_pass http://livekit_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header 'Access-Control-Allow-Origin';
            add_header 'Access-Control-Allow-Origin' 'https://yourdomain.com' always;
        }
    }

    # ===========================================================
    # live.yourdomain.com — Redirect to main site / broadcast
    # ===========================================================
    server {
        listen 443 ssl http2;
        server_name live.yourdomain.com www.live.yourdomain.com;

        ssl_certificate /etc/ssl/mediasite/live/live.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/ssl/mediasite/live/live.yourdomain.com/privkey.pem;

        location / {
            return 301 https://yourdomain.com/broadcast;
        }
    }

    ##
    # RTMP is handled by bare-metal nginx (port 1936)
    # to keep the RTMP module separate from this Docker nginx.
    # See: /etc/nginx/nginx.conf (bare metal) for RTMP block
    ##
}
